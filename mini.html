<!-- language: HTML, file: mini.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>HasePlayer Mini</title>
  <link rel="stylesheet" href="mini.css" />
</head>
<body>
  <div class="mini" id="mini">
    <div class="mini-cover-wrap" id="coverWrap">
      <div class="mini-cover-img" id="coverA"></div>
    </div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">Нет трека</div>
      <div class="mini-artist" id="miniArtist">—</div>
    </div>
    <div class="mini-controls">
      <button id="miniPrev" title="Назад">⏮</button>
      <button id="miniPlay" class="mini-play" title="Играть">▶</button>
      <button id="miniNext" title="Вперёд">⏭</button>
    </div>
    <div class="mini-actions">
      <button id="miniExpand" title="Развернуть">⤢</button>
      <button id="miniHide" title="Скрыть в трей">✕</button>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
